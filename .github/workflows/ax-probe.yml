name: AX probe
on:
  push:
    branches: [scratch/ax-probe]
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: The machine
        run: |
          sw_vers; whoami; id
          csrutil status || true
          echo "--- system TCC rows"
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value, auth_reason from access" 2>&1 | head -60 || true
          echo "--- user TCC rows"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "select service, client, auth_value, auth_reason from access" 2>&1 | head -60 || true
      - name: Probe Accessibility and real clicks
        run: |
          swiftc -O .github/scripts/ax-probe.swift -o "$RUNNER_TEMP/ax-probe"
          "$RUNNER_TEMP/ax-probe" 2>&1 | head -150
      - name: System Events through osascript
        run: |
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1 || echo "osascript exit $?"
