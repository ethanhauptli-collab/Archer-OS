name: Mac app end to end

# The packaged Mac app on an Apple Silicon runner, driven the way a person drives it (its Accessibility tree and real mouse
# clicks, .github/scripts/ui-drive.swift): the first launch with nothing signed in, footage handed to the app, Footage > Brief >
# Add > Ready, a build with no AI through the app's own process runner, the finished cut checked against Apple's DTD, a re-cut
# from Adjust, a run Cancel stops, a run that ends on a usage limit, Venture Studio's music and sound effects (a made-up Studio),
# the AI path with a stand-in for Claude Code, the file panel, a real drag of files onto the window, a revision stopped by a usage
# limit and Finish without AI, and Update Roughcut… in the menu. A picture and the Accessibility tree of the steps go on the
# ui-e2e branch (replaced each time). The footage is made up (macOS `say` and ffmpeg): no one's footage, key or account.
on:
  workflow_dispatch:
  push:
    branches: [ui/assembly-line]
    paths:
      - "mac/Sources/**"
      - "mac/Package.swift"
      - "roughcut/**"
      - ".github/scripts/app-e2e.sh"
      - ".github/scripts/ui-drive.swift"
      - ".github/scripts/ui-drag-source.swift"
      - ".github/scripts/fake-studio.py"
      - ".github/scripts/fake-claude.py"
      - ".github/workflows/mac-app-e2e.yml"

permissions:
  contents: write

concurrency:
  group: ui-e2e
  cancel-in-progress: true

jobs:
  drive:
    name: Drive the packaged app
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - name: Compile the drivers (a mistake in them shows up here, before the app is built)
        run: |
          swiftc -O .github/scripts/ui-drive.swift -o "$RUNNER_TEMP/ui-drive"
          swiftc -O .github/scripts/ui-drag-source.swift -o "$RUNNER_TEMP/ui-drag-source"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: brew install ffmpeg
      - name: The engine, where the app looks for it (.venv/bin/roughcut)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[mac,dev,graphics]'
      - name: Package Roughcut.app
        run: mac/scripts/build-app.sh
      - name: Drive the app
        shell: bash
        run: .github/scripts/app-e2e.sh "$RUNNER_TEMP/e2e" 2>&1 | tee "$RUNNER_TEMP/e2e-log.txt"
      - name: Put the pictures on the ui-e2e branch
        if: always()
        run: |
          set -euo pipefail
          sha="$(git rev-parse --short HEAD)"
          mkdir -p "$RUNNER_TEMP/publish"
          cp "$RUNNER_TEMP"/e2e/pictures/* "$RUNNER_TEMP/publish/" 2>/dev/null || true
          cp "$RUNNER_TEMP/e2e-log.txt" "$RUNNER_TEMP/publish/log.txt" 2>/dev/null || true
          for name in edit_report.md result.json versions.json roughcut.log; do
              cp "$RUNNER_TEMP/e2e/Walk and talk_roughcut/$name" "$RUNNER_TEMP/publish/out-$name" 2>/dev/null || true
          done
          echo "The packaged Mac app driven end to end at $sha. Made-up footage only." > "$RUNNER_TEMP/publish/README.txt"
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ui-e2e
          git rm -rf --cached --quiet . || true
          git --work-tree="$RUNNER_TEMP/publish" add -A
          git commit --quiet -m "The packaged Mac app driven end to end at $sha"
          git push --force origin HEAD:refs/heads/ui-e2e
